<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>점진적 과부하 - 운동 기록 & 분석</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#090b10" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5fbe8',
              100: '#e8f7c9',
              400: '#c8f56b',
              500: '#b8f35a',
              600: '#9bd63f',
              bg: '#090b10',
              card: '#11151c',
              border: '#202733',
              accent: '#b8f35a'
            }
          }
        }
      }
    }
  </script>

  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Font (Pretendard) -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #0a0f1d;
      color: #f8fafc;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #0a0f1d; }
    ::-webkit-scrollbar-thumb { background: #243047; border-radius: 4px; }
    .today-highlight { border: 1px solid #b8f35a !important; box-shadow: inset 0 0 0 1px rgba(184,243,90,.12), 0 0 0 1px rgba(184,243,90,.16) !important; }
    .goal-highlight { border: 1px solid #38bdf8 !important; box-shadow: inset 0 0 0 1px rgba(56,189,248,.12), 0 0 0 1px rgba(56,189,248,.16) !important; }
    :root { color-scheme: dark; }
    body { background: #090b10; letter-spacing: -0.01em; }
    button, input, select { font-family: inherit; }
    button { -webkit-touch-callout: none; }
    .bg-brand-card { background: linear-gradient(145deg, #141922 0%, #10141b 100%) !important; }
    .border-brand-border { border-color: #242b36 !important; }
    .rounded-2xl { border-radius: 20px !important; }
    .rounded-xl { border-radius: 15px !important; }
    .shadow-2xl { box-shadow: 0 24px 70px rgba(0,0,0,.48) !important; }
    .neon-shadow { box-shadow: 0 10px 30px rgba(184,243,90,.16) !important; }
    input, select { transition: border-color .18s ease, background .18s ease, box-shadow .18s ease; }
    input:focus, select:focus { box-shadow: 0 0 0 3px rgba(184,243,90,.08); }
    nav { padding-bottom: calc(.5rem + env(safe-area-inset-bottom)) !important; }
    @media (min-width: 640px) { #root > div { max-width: 520px; margin: 0 auto; } }
  </style>
</head>
<body class="bg-[#0a0f1d] text-slate-100 min-h-screen">

  <div id="root" class="w-full min-h-screen bg-[#0a0f1d] flex flex-col relative"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Helper Functions for Date formatting ---
    const getFormattedDate = (dateObj = new Date()) => {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      const dayNames = ["일", "월", "화", "수", "목", "금", "토"];
      const dayName = dayNames[dateObj.getDay()];
      return `${year}.${month}.${day} (${dayName})`;
    };

    const getIsoDateStr = (dateObj = new Date()) => {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const parseIsoDate = (isoStr) => {
      if (!isoStr) return new Date();
      const [y, m, d] = isoStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    };

    // Calculate D-Day
    const calculateDDay = (targetDateStr) => {
      if (!targetDateStr) return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      const target = parseIsoDate(targetDateStr);
      target.setHours(0, 0, 0, 0);

      const diffTime = target.getTime() - today.getTime();
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays === 0) return "D-Day";
      if (diffDays > 0) return `D-${diffDays}`;
      return `D+${Math.abs(diffDays)}`;
    };

    // Monday to Sunday for Current Week
    const getCurrentWeekDays = () => {
      const now = new Date();
      const currentDay = now.getDay();
      const distanceToMon = currentDay === 0 ? -6 : 1 - currentDay;
      const monday = new Date(now);
      monday.setDate(now.getDate() + distanceToMon);

      const days = [];
      const dayLabels = ["월", "화", "수", "목", "금", "토", "일"];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        days.push({
          dateIso: getIsoDateStr(d),
          dayLabel: dayLabels[i]
        });
      }
      return days;
    };

    const formatDateRange = (startDate, endDate) => {
      const sm = startDate.getMonth() + 1;
      const sd = startDate.getDate();
      const em = endDate.getMonth() + 1;
      const ed = endDate.getDate();
      return `${sm}/${sd}~${em}/${ed}`;
    };

    const Icon = ({ name, size = 20, className = "" }) => {
      const icons = {
        home: <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10" />,
        log: <path d="M19 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z M16 2v4 M8 2v4 M3 10h18" />,
        analytics: <path d="M18 20V10 M12 20V4 M6 20v-6" />,
        target: <path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M12 18a6 6 0 1 0 0-12 6 6 0 0 0 12z M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" />,
        more: <path d="M12 12h.01 M19 12h.01 M5 12h.01" />,
        close: <path d="M6 6l12 12 M18 6L6 18" />,
        trophy: <path d="M8 21h8 M12 17v4 M7 4h10v7a5 5 0 0 1-10 0V4z M7 7H4v2a4 4 0 0 0 4 4 M17 7h3v2a4 4 0 0 1-4 4" />,
        flame: <path d="M12 2c0 3-2 5-4 7 0-2-1-3-2-3-1 2-1 4 0 7 0 4 3 7 7 7s7-3 7-7c0-3-2-5-4-7 0 2-1 3-2 3-1-2-1-4 0-7z" />,
        zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />,
        chart: <path d="M4 19V5 M4 19h16 M8 16v-5 M12 16V8 M16 16v-4" />,
        plus: <path d="M12 5v14 M5 12h14" />,
        check: <path d="M20 6L9 17l-5-5" />,
        chevronLeft: <path d="M15 18l-6-6 6-6" />,
        chevronRight: <path d="M9 18l6-6-6-6" />,
        dumbbell: <path d="m6.5 6.5 11 11 M21 21l-1-1 M3 3l1 1 M18 22l3-3 M3 6l3-3 M14 2l4 4 M2 14l4 4" />,
        trash: <path d="M3 6h18 M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />,
        pencil: <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />,
        download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3" />,
        upload: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M17 8l-5-5-5 5 M12 3v12" />,
        scale: <path d="M12 3v18 M3 12h18 M5 7l7 5 7-5" />,
        calendar: <g><rect x="3" y="4" width="18" height="18" rx="2" ry="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></g>,
        settings: <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />,
        runner: <path d="M13 4a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm-4.5 12l2.5-3.5L8.5 7h5l1.5 3.5h3v2h-4l-1-2.5-1.5 2 2.5 4H8.5z" />
      };

      return (
        <svg 
          xmlns="http://www.w3.org/2000/svg" 
          width={size} 
          height={size} 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          strokeWidth="2" 
          strokeLinecap="round" 
          strokeLinejoin="round" 
          className={className}
        >
          {icons[name] || <circle cx="12" cy="12" r="10" />}
        </svg>
      );
    };

    const DEFAULT_EXERCISE_CONFIGS = {};
    const DEFAULT_EXERCISE_TYPES = [];

    const CLEAN_INITIAL_DATA = {
      user: { name: "운동러" },
      exerciseTypes: DEFAULT_EXERCISE_TYPES,
      exerciseConfigs: DEFAULT_EXERCISE_CONFIGS,
      dailyLogs: {},
      completedDates: [],
      goals: []
    };

    function App() {
      const [appData, setAppData] = useState(() => {
        const saved = localStorage.getItem("progressive_overload_data");
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (!parsed.exerciseTypes) parsed.exerciseTypes = DEFAULT_EXERCISE_TYPES;
            if (!parsed.exerciseConfigs) parsed.exerciseConfigs = DEFAULT_EXERCISE_CONFIGS;
            if (!parsed.dailyLogs) parsed.dailyLogs = {};
            if (!parsed.goals) parsed.goals = [];
            return parsed;
          } catch (e) {
            return CLEAN_INITIAL_DATA;
          }
        }
        return CLEAN_INITIAL_DATA;
      });

      const [activeTab, setActiveTab] = useState("home");
      const [showToast, setShowToast] = useState(false);
      const [toastMsg, setToastMsg] = useState("");

      // Calendar Navigation
      const todayObj = new Date();
      const [calYear, setCalYear] = useState(todayObj.getFullYear());
      const [calMonth, setCalMonth] = useState(todayObj.getMonth());

      // Workout Record View Modal
      const [selectedDateIso, setSelectedDateIso] = useState(null);
      const [showDateModal, setShowDateModal] = useState(false);

      // Select Exercise Modal
      const [showSelectExModal, setShowSelectExModal] = useState(false);

      // Exercise List Config Settings Modal (More Tab)
      const [showExConfigModal, setShowExConfigModal] = useState(false);
      const [newCustomExName, setNewCustomExName] = useState("");

      // Analytics Selected Exercise
      const [analyticsEx, setAnalyticsEx] = useState("");

      // Goals Modal State (등록 및 수정 모드)
      const [showGoalModal, setShowGoalModal] = useState(false);
      const [editingGoalId, setEditingGoalId] = useState(null); // null이면 신규 추가, 숫동 ID면 수정
      const [goalType, setGoalType] = useState("exercise");
      const [goalExName, setGoalExName] = useState("");
      const [goalTarget, setGoalTarget] = useState("");
      const [goalStartWeight, setGoalStartWeight] = useState(""); // 체중목표용 시작 체중
      const [goalUnit, setGoalUnit] = useState("회");
      const [goalDeadline, setGoalDeadline] = useState(getIsoDateStr());
      const [weightGoalType, setWeightGoalType] = useState("loss");

      // Full Reset Confirm Modal
      const [showResetModal, setShowResetModal] = useState(false);

      const fileInputRef = useRef(null);

      useEffect(() => {
        localStorage.setItem("progressive_overload_data", JSON.stringify(appData));
      }, [appData]);

      const triggerToast = (msg) => {
        setToastMsg(msg);
        setShowToast(true);
        setTimeout(() => setShowToast(false), 2500);
      };

      const todayIso = getIsoDateStr();
      const todayFormatted = getFormattedDate();

      const todayLog = appData.dailyLogs[todayIso] || { weight: "", exercises: [] };

      // Stats Calculations
      const totalCompletedSetsToday = useMemo(() => {
        return (todayLog.exercises || []).reduce((acc, ex) => {
          return acc + (ex.sets || []).filter(s => s.done).length;
        }, 0);
      }, [todayLog]);

      const totalRepsToday = useMemo(() => {
        return (todayLog.exercises || []).reduce((acc, ex) => {
          return acc + (ex.sets || []).filter(s => s.done).reduce((sAcc, s) => sAcc + Number(s.reps || 0), 0);
        }, 0);
      }, [todayLog]);

      const totalCardioMinutesToday = useMemo(() => {
        return (todayLog.exercises || []).reduce((acc, ex) => {
          const cfg = appData.exerciseConfigs[ex.name] || {};
          if (cfg.isCardio) {
            return acc + (ex.sets || []).filter(s => s.done).reduce((sAcc, s) => sAcc + Number(s.duration || 0), 0);
          }
          return acc;
        }, 0);
      }, [todayLog, appData.exerciseConfigs]);

      const currentLatestWeight = useMemo(() => {
        const sortedDates = Object.keys(appData.dailyLogs || {})
          .filter(d => appData.dailyLogs[d] && appData.dailyLogs[d].weight)
          .sort((a, b) => b.localeCompare(a));
        if (sortedDates.length > 0) {
          return Number(appData.dailyLogs[sortedDates[0]].weight);
        }
        return 0;
      }, [appData.dailyLogs]);

      const goalDeadlinesMap = useMemo(() => {
        const map = {};
        (appData.goals || []).forEach(g => {
          if (g.deadline) {
            if (!map[g.deadline]) map[g.deadline] = [];
            map[g.deadline].push(g);
          }
        });
        return map;
      }, [appData.goals]);

      const weightHistoryList = useMemo(() => {
        return Object.keys(appData.dailyLogs || {})
          .filter(d => appData.dailyLogs[d] && appData.dailyLogs[d].weight)
          .sort((a, b) => a.localeCompare(b))
          .map(d => ({
            dateIso: d,
            dateLabel: `${Number(d.split('-')[1])}/${Number(d.split('-')[2])}`,
            weight: Number(appData.dailyLogs[d].weight)
          }));
      }, [appData.dailyLogs]);

      const selectedAnalyticsCfg = appData.exerciseConfigs[analyticsEx] || { useWeight: true, useReps: true, isCardio: false };

      const weeklyStats = useMemo(() => {
        if (!analyticsEx) return [];
        const logs = appData.dailyLogs || {};
        const weeksMap = {};

        Object.keys(logs).forEach(dateIso => {
          const dayLog = logs[dateIso];
          if (!dayLog || !dayLog.exercises) return;

          const dateObj = parseIsoDate(dateIso);
          const dayOfWeek = dateObj.getDay();
          const dist = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
          const monday = new Date(dateObj);
          monday.setDate(dateObj.getDate() + dist);
          
          const sunday = new Date(monday);
          sunday.setDate(monday.getDate() + 6);

          const weekKey = getIsoDateStr(monday);

          if (!weeksMap[weekKey]) {
            weeksMap[weekKey] = {
              mondayObj: monday,
              sundayObj: sunday,
              totalWeightSum: 0,
              weightCount: 0,
              totalRepsSum: 0,
              repsCount: 0,
              totalSpeedSum: 0,
              totalDurationSum: 0,
              cardioCount: 0
            };
          }

          dayLog.exercises.forEach(ex => {
            if (ex.name === analyticsEx) {
              (ex.sets || []).forEach(s => {
                if (s.done) {
                  if (selectedAnalyticsCfg.isCardio) {
                    weeksMap[weekKey].totalSpeedSum += Number(s.speed || 0);
                    weeksMap[weekKey].totalDurationSum += Number(s.duration || 0);
                    weeksMap[weekKey].cardioCount += 1;
                  } else {
                    if (selectedAnalyticsCfg.useWeight) {
                      weeksMap[weekKey].totalWeightSum += Number(s.weight || 0);
                      weeksMap[weekKey].weightCount += 1;
                    }
                    if (selectedAnalyticsCfg.useReps) {
                      weeksMap[weekKey].totalRepsSum += Number(s.reps || 0);
                      weeksMap[weekKey].repsCount += 1;
                    }
                  }
                }
              });
            }
          });
        });

        const sortedKeys = Object.keys(weeksMap).sort((a, b) => a.localeCompare(b));
        return sortedKeys.map((wk, idx) => {
          const data = weeksMap[wk];
          const avgWeight = data.weightCount > 0 ? (data.totalWeightSum / data.weightCount).toFixed(1) : 0;
          const avgReps = data.repsCount > 0 ? (data.totalRepsSum / data.repsCount).toFixed(1) : 0;
          const avgSpeed = data.cardioCount > 0 ? (data.totalSpeedSum / data.cardioCount).toFixed(1) : 0;
          const avgDuration = data.cardioCount > 0 ? (data.totalDurationSum / data.cardioCount).toFixed(1) : 0;

          return {
            weekNum: idx + 1,
            dateRange: formatDateRange(data.mondayObj, data.sundayObj),
            avgWeight: Number(avgWeight),
            avgReps: Number(avgReps),
            avgSpeed: Number(avgSpeed),
            avgDuration: Number(avgDuration)
          };
        });
      }, [appData.dailyLogs, analyticsEx, selectedAnalyticsCfg]);

      const openDateRecordModal = (dateIso) => {
        setSelectedDateIso(dateIso);
        setShowDateModal(true);
      };

      const handleDateWeightChange = (dateIso, val) => {
        setAppData(prev => {
          const logs = { ...prev.dailyLogs };
          const dayLog = logs[dateIso] ? { ...logs[dateIso] } : { weight: "", exercises: [] };
          dayLog.weight = val;
          logs[dateIso] = dayLog;
          return { ...prev, dailyLogs: logs };
        });
      };

      const addExerciseToDate = (dateIso, exerciseName) => {
        if (!exerciseName) return;
        const cfg = appData.exerciseConfigs[exerciseName] || { useWeight: true, useReps: true, useSets: true, isCardio: false };

        setAppData(prev => {
          const logs = { ...prev.dailyLogs };
          const dayLog = logs[dateIso] ? { ...logs[dateIso] } : { weight: "", exercises: [] };
          const exercises = [...(dayLog.exercises || [])];

          const initialSets = cfg.isCardio 
            ? [{ setNum: 1, speed: 8, duration: 20, done: false }]
            : cfg.useSets 
              ? [
                  { setNum: 1, reps: 10, weight: 0, done: false },
                  { setNum: 2, reps: 10, weight: 0, done: false },
                  { setNum: 3, reps: 10, weight: 0, done: false }
                ]
              : [
                  { setNum: 1, reps: 10, weight: 0, done: false }
                ];

          exercises.push({
            id: "ex_" + Date.now(),
            name: exerciseName,
            sets: initialSets
          });

          dayLog.exercises = exercises;
          logs[dateIso] = dayLog;
          return { ...prev, dailyLogs: logs };
        });

        setShowSelectExModal(false);
        triggerToast(`'${exerciseName}' 종목이 추가되었습니다.`);
      };

      const toggleSetDoneForDate = (dateIso, exId, setIndex) => {
        setAppData(prev => {
          const logs = { ...prev.dailyLogs };
          const dayLog = logs[dateIso] ? { ...logs[dateIso] } : { weight: "", exercises: [] };
          const exercises = [...(dayLog.exercises || [])];
          const exObj = exercises.find(e => e.id === exId);

          if (exObj && exObj.sets[setIndex]) {
            exObj.sets[setIndex].done = !exObj.sets[setIndex].done;
          }

          dayLog.exercises = exercises;
          logs[dateIso] = dayLog;

          const hasAnyDone = exercises.some(e => e.sets.some(s => s.done));
          let compDates = [...(prev.completedDates || [])];
          if (hasAnyDone) {
            if (!compDates.includes(dateIso)) compDates.push(dateIso);
          } else {
            compDates = compDates.filter(d => d !== dateIso);
          }

          return { ...prev, dailyLogs: logs, completedDates: compDates };
        });
      };

      const updateSetFieldForDate = (dateIso, exId, setIndex, field, val) => {
        const numVal = parseFloat(val) || 0;
        setAppData(prev => {
          const logs = { ...prev.dailyLogs };
          const dayLog = logs[dateIso] ? { ...logs[dateIso] } : { weight: "", exercises: [] };
          const exercises = [...(dayLog.exercises || [])];
          const exObj = exercises.find(e => e.id === exId);

          if (exObj && exObj.sets[setIndex]) {
            exObj.sets[setIndex][field] = numVal;
          }

          dayLog.exercises = exercises;
          logs[dateIso] = dayLog;
          return { ...prev, dailyLogs: logs };
        });
      };

      const addSetToExerciseForDate = (dateIso, exId) => {
        setAppData(prev => {
          const logs = { ...prev.dailyLogs };
          const dayLog = logs[dateIso] ? { ...logs[dateIso] } : { weight: "", exercises: [] };
          const exercises = [...(dayLog.exercises || [])];
          const exObj = exercises.find(e => e.id === exId);

          if (exObj) {
            const cfg = prev.exerciseConfigs[exObj.name] || {};
            const lastSet = exObj.sets[exObj.sets.length - 1];
            const newSetNum = exObj.sets.length + 1;

            if (cfg.isCardio) {
              exObj.sets.push({
                setNum: newSetNum,
                speed: lastSet ? lastSet.speed : 8,
                duration: lastSet ? lastSet.duration : 20,
                done: false
              });
            } else {
              exObj.sets.push({
                setNum: newSetNum,
                reps: lastSet ? lastSet.reps : 10,
                weight: lastSet ? lastSet.weight : 0,
                done: false
              });
            }
          }

          dayLog.exercises = exercises;
          logs[dateIso] = dayLog;
          return { ...prev, dailyLogs: logs };
        });
      };

          const dayLog = logs[dateIso] ? { ...logs[dateIso] } : { weight: "", exercises: [] };
          dayLog.exercises = (dayLog.exercises || []).filter(e => e.id !== exId);
          logs[dateIso] = dayLog;

          const hasAnyDone = dayLog.exercises.some(e => e.sets.some(s => s.done));
          let compDates = [...(prev.completedDates || [])];
          if (!hasAnyDone) {
            compDates = compDates.filter(d => d !== dateIso);
          }

          return { ...prev, dailyLogs: logs, completedDates: compDates };
        });
        triggerToast("운동이 삭제되었습니다.");

      const handleToggleExConfigFlag = (exName, flag) => {
        setAppData(prev => {
          const configs = { ...prev.exerciseConfigs };
          const currentConfig = configs[exName] || { useWeight: true, useReps: true, useSets: true, isCardio: false };
          
          let updated = { ...currentConfig, [flag]: !currentConfig[flag] };

          if (flag === 'isCardio' && updated.isCardio) {
            updated.useWeight = false;
            updated.useReps = false;
            updated.useSets = false;
          } else if (flag !== 'isCardio' && updated.isCardio) {
            updated.isCardio = false;

          configs[exName] = updated;
          return { ...prev, exerciseConfigs: configs };
        });

          return;

        setAppData(prev => ({
          ...prev,
          exerciseTypes: [...prev.exerciseTypes, name],

      /* [요구사항 1 & 2] 목표 등록 및 수정 처리 */

        const firstDayOfWeek = new Date(calYear, calMonth, 1).getDay();

        const dayCells = [];
        for (let i = 0; i < firstDayOfWeek; i++) {

        }

          dayCells.push({ dayNum: d, dateIso });

          if (calMonth === 0) {
            setCalMonth(11);
            setCalYear(calYear - 1);
          } else {
            setCalMonth(calMonth - 1);
          }
        };

        const handleNextMonth = () => {
          if (calMonth === 11) {
            setCalMonth(0);
            setCalYear(calYear + 1);
          } else {
            setCalMonth(calMonth + 1);
          }
        };

        const monthNames = ["1월", "2월", "3월", "4월", "5월", "6월", "7월", "8월", "9월", "10월", "11월", "12월"];

          <div className="space-y-3">

            {(!appData.goals || appData.goals.length === 0) ? (

              </div>
            ) : (
              appData.goals.map((g) => {
                let curVal = 0;
                let pct = 0;
                let startW = g.startWeight || 0;

                /* [요구사항 1] 정확한 체중 감량/증량 퍼센트 계산 */
                if (g.type === "weight") {
                  curVal = currentLatestWeight || 0;
                  
                  // 만약 startWeight가 과거 기록에 없는 경우 현재 체중으로 보정
                  if (!startW || startW === 0) {
                    startW = curVal > 0 ? curVal : g.target;
                  }

                  const targetW = g.target;

                  if (g.weightGoalType === "loss") {
                    // 체중 감량 (시작: 80 -> 목표: 70)
                    if (startW <= targetW) {
                      pct = curVal <= targetW ? 100 : 0;
                    } else {
                      const totalLossNeeded = startW - targetW;
                      const actualLoss = startW - curVal;
                      pct = Math.round((actualLoss / totalLossNeeded) * 100);
                    }
                  } else {
                    // 체중 증량 (시작: 60 -> 목표: 70)
                    if (targetW <= startW) {
                      pct = curVal >= targetW ? 100 : 0;
                    } else {
                      const totalGainNeeded = targetW - startW;
                      const actualGain = curVal - startW;
                      pct = Math.round((actualGain / totalGainNeeded) * 100);
                    }
                  }

                  // 0% ~ 100% 범위 제한
                  pct = Math.max(0, Math.min(100, pct));
                } else {
                  // 운동 목표 계산
                  Object.values(appData.dailyLogs || {}).forEach(dayLog => {
                    (dayLog.exercises || []).forEach(e => {
                      if (e.name === g.exerciseName) {
                        (e.sets || []).forEach(s => {
                          if (s.done) {
                            if (g.unit === "kg") {
                              curVal = Math.max(curVal, Number(s.weight || 0));
                            } else if (g.unit === "분") {
                              curVal = Math.max(curVal, Number(s.duration || 0));
                            } else {
                              curVal = Math.max(curVal, Number(s.reps || 0));
                            }
                          }
                        });
                      }
                    });
                  });
                  pct = Math.min(100, Math.round((curVal / Math.max(1, g.target)) * 100));
                }

                const dDayLabel = calculateDDay(g.deadline);

                return (
                  <div key={g.id} className="bg-brand-card p-4 rounded-2xl border border-brand-border space-y-2 relative">
                    <div className="flex justify-between items-start">
                      <div className="flex items-center gap-2">
                        <span className={`p-1.5 rounded-lg text-xs font-bold ${
                          g.type === 'weight' ? 'bg-blue-500/10 text-blue-400' : 'bg-brand-accent/10 text-brand-accent'
                        }`}>
                          {g.type === 'weight' ? (g.weightGoalType === 'loss' ? '체중 감량' : '체중 증량') : '운동'}

                              목표기한: {g.deadline}
                            </span>
                          )}
                        </div>
                      </div>
                      
                      <div className="flex items-center gap-1.5">
                        {dDayLabel && (
                          <span className={`px-2 py-0.5 rounded-full text-[11px] font-extrabold ${
                            dDayLabel === 'D-Day' 
                              ? 'bg-red-500/20 text-red-400 border border-red-500/40' 
                              : dDayLabel.startsWith('D-') 
                                ? 'bg-brand-accent/20 text-brand-accent border border-brand-accent/30' 
                                : 'bg-slate-800 text-slate-400 border border-slate-700'
                          }`}>
                            {dDayLabel}
                          </span>
                        )}
                        
                        {/* [요구사항 2] 목표 수정 버튼 */}

                          onClick={() => openEditGoalModal(g)} 
                          className="text-slate-400 hover:text-brand-accent p-1.5 rounded-lg hover:bg-slate-800/80 transition"
                          title="목표 수정"
                        >
                          <Icon name="pencil" size={14} />
                        </button>
                        
                        <button 
                          onClick={() => deleteGoal(g.id)} 
                          className="text-slate-500 hover:text-red-400 p-1.5 rounded-lg hover:bg-slate-800/80 transition"
                          title="목표 삭제"
                        >
                          <Icon name="trash" size={14} />

                    <div className="flex justify-between items-center text-xs pt-1">
                      {g.type === "weight" ? (
                        <span className="text-slate-400 text-[11px]">
                          시작: <span className="text-slate-300 font-semibold">{startW}kg</span> → 현재: <strong className="text-white">{curVal > 0 ? `${curVal}kg` : "미입력"}</strong> / 목표: <strong className="text-brand-accent">{g.target}kg</strong>
                        </span>

          {renderGoalModal()}
          {renderResetModal()}

          <nav className="fixed bottom-0 left-0 right-0 bg-[#0a0f1d]/95 backdrop-blur-md border-t border-slate-800/80 px-2 py-2 flex justify-around items-center z-40">
            {[
              { id: "home", label: "홈", icon: "home" },
              { id: "log", label: "기록", icon: "log" },
              { id: "analytics", label: "분석", icon: "analytics" },
              { id: "goals", label: "목표", icon: "target" },
              { id: "more", label: "더보기", icon: "more" },
            ].map((tab) => {
              const isActive = activeTab === tab.id;
              return (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`flex flex-col items-center gap-1 px-3 py-1 rounded-xl transition ${
                    isActive ? "text-brand-accent font-bold" : "text-slate-500 hover:text-slate-300"
                  }`}
                >
                  <Icon name={tab.icon} size={20} />
                  <span className="text-[10px]">{tab.label}</span>
                </button>
              );
            })}
          </nav>
        </div>
      );
    }

    // Render React App
    window.onload = function() {
      ReactDOM.render(<App />, document.getElementById("root"));
    };
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
